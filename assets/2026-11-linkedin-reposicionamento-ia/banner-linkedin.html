<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Banner LinkedIn Gabriel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Montserrat:wght@400;500;600&display=block" rel="stylesheet">
<style>
  :root{
    --preto:#0A0A0A; --creme:#E5DAC8; --teal:#26A69A; --verm:#B71C1C;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1584px;height:396px;background:var(--preto);overflow:hidden}
  .banner{position:relative;width:1584px;height:396px;overflow:hidden;
    background:
      radial-gradient(ellipse 520px 300px at 1290px 200px, rgba(38,166,154,.10), transparent 70%),
      radial-gradient(ellipse 700px 380px at 760px 180px, rgba(229,218,200,.05), transparent 70%),
      var(--preto);}
  /* grid oculto: linhas quase invisíveis */
  .grid{position:absolute;inset:0;
    background-image:
      linear-gradient(to right, rgba(229,218,200,.045) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(229,218,200,.045) 1px, transparent 1px);
    background-size:66px 66px;
    -webkit-mask-image:radial-gradient(ellipse 900px 300px at 800px 198px,#000 20%,transparent 85%);}
  svg.deco{position:absolute;inset:0}
  .texto{position:absolute;left:470px;top:0;height:396px;width:640px;
    display:flex;flex-direction:column;justify-content:center;}
  .kicker{font:500 13px/1 Montserrat,sans-serif;letter-spacing:.42em;color:var(--teal);
    display:flex;align-items:center;gap:14px;margin-bottom:22px}
  .kicker i{display:inline-block;width:8px;height:8px;background:var(--verm);transform:rotate(45deg)}
  h1{font:600 58px/1.02 Cinzel,serif;color:var(--creme);letter-spacing:.04em}
  h1 .amp{font-weight:500;color:var(--teal)}
  .linha{width:150px;height:1px;background:linear-gradient(90deg,var(--creme),transparent);opacity:.5;margin:22px 0 18px}
  .sub{font:400 17px/1.55 Montserrat,sans-serif;color:rgba(229,218,200,.78);letter-spacing:.02em}
  .sub b{font-weight:600;color:var(--creme)}
  .ia{display:inline-flex;align-items:center;gap:8px;color:var(--teal);font-weight:500}
  .assin{position:absolute;right:42px;bottom:22px;font:500 11px/1 Montserrat,sans-serif;
    letter-spacing:.38em;color:rgba(229,218,200,.45)}
</style>
</head>
<body>
<div class="banner">
  <div class="grid"></div>

  <svg class="deco" width="1584" height="396" viewBox="0 0 1584 396">
    <defs>
      <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#151413"/><stop offset="1" stop-color="#0C0C0B"/>
      </linearGradient>
      <filter id="sombra" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".75"/>
      </filter>
      <filter id="brilho"><feGaussianBlur stdDeviation="2.2"/></filter>
      <!-- carta base 150x220 -->
      <g id="carta">
        <rect x="0" y="0" width="150" height="220" rx="11" fill="url(#face)" stroke="#E5DAC8" stroke-opacity=".75" stroke-width="1.4"/>
        <rect x="9" y="9" width="132" height="202" rx="6" fill="none" stroke="#E5DAC8" stroke-opacity=".22" stroke-width="1"/>
      </g>
      <path id="losango" d="M0,-9 L7,0 L0,9 L-7,0 Z"/>
      <path id="brilhinho" d="M0,-8 C1,-2 2,-1 8,0 C2,1 1,2 0,8 C-1,2 -2,1 -8,0 C-2,-1 -1,-2 0,-8Z"/>
    </defs>

    <!-- arco mágico atrás das cartas -->
    <circle cx="1300" cy="214" r="168" fill="none" stroke="#E5DAC8" stroke-opacity=".08" stroke-width="1"/>
    <circle cx="1300" cy="214" r="196" fill="none" stroke="#26A69A" stroke-opacity=".12" stroke-width="1" stroke-dasharray="2 9"/>

    <!-- leque de cartas -->
    <g filter="url(#sombra)">
      <!-- Carta 1: Web Design (♠ estilizado = janela de navegador) -->
      <g transform="translate(1196 336) rotate(-13) translate(-75 -250)">
        <use href="#carta"/>
        <text x="18" y="34" font-family="Cinzel" font-size="20" fill="#E5DAC8">W</text>
        <use href="#losango" transform="translate(25 50) scale(.75)" fill="#26A69A"/>
        <g transform="translate(75 112)" fill="none" stroke="#E5DAC8" stroke-width="1.3" stroke-opacity=".9">
          <rect x="-38" y="-30" width="76" height="58" rx="5"/>
          <line x1="-38" y1="-17" x2="38" y2="-17"/>
          <circle cx="-30" cy="-23.5" r="1.8" fill="#B71C1C" stroke="none"/>
          <circle cx="-24" cy="-23.5" r="1.8" fill="#E5DAC8" stroke="none" opacity=".6"/>
          <rect x="-28" y="-8" width="32" height="5" fill="#26A69A" stroke="none" opacity=".85"/>
          <rect x="-28" y="2" width="22" height="3" fill="#E5DAC8" stroke="none" opacity=".5"/>
          <rect x="-28" y="10" width="18" height="7" rx="2" stroke="#26A69A"/>
          <rect x="10" y="-8" width="20" height="25" rx="2" stroke-opacity=".5"/>
        </g>
        <text x="75" y="190" text-anchor="middle" font-family="Montserrat" font-weight="500" font-size="9" letter-spacing="2.6" fill="#E5DAC8" fill-opacity=".7">WEB DESIGN</text>
      </g>

      <!-- Carta 3: IA (atrás à direita) -->
      <g transform="translate(1404 336) rotate(13) translate(-75 -250)">
        <use href="#carta"/>
        <text x="18" y="34" font-family="Cinzel" font-size="20" fill="#E5DAC8">IA</text>
        <use href="#losango" transform="translate(25 50) scale(.75)" fill="#26A69A"/>
        <g transform="translate(75 110)">
          <use href="#brilhinho" transform="scale(3.4)" fill="none" stroke="#26A69A" stroke-width=".45"/>
          <use href="#brilhinho" transform="translate(26 -26) scale(1.2)" fill="#E5DAC8"/>
          <use href="#brilhinho" transform="translate(-24 24) scale(.8)" fill="#E5DAC8" opacity=".7"/>
          <circle r="3" fill="#26A69A"/>
        </g>
        <text x="75" y="190" text-anchor="middle" font-family="Montserrat" font-weight="500" font-size="9" letter-spacing="2.6" fill="#E5DAC8" fill-opacity=".7">CRIATIVOS IA</text>
      </g>

      <!-- Carta 2: Design (frente, centro) - o Ás de ouros -->
      <g transform="translate(1300 330) rotate(0) translate(-75 -276)">
        <use href="#carta"/>
        <text x="18" y="34" font-family="Cinzel" font-size="22" fill="#E5DAC8">D</text>
        <use href="#losango" transform="translate(25 52) scale(.8)" fill="#B71C1C"/>
        <g transform="rotate(180 75 110)">
          <text x="18" y="34" font-family="Cinzel" font-size="22" fill="#E5DAC8">D</text>
          <use href="#losango" transform="translate(25 52) scale(.8)" fill="#B71C1C"/>
        </g>
        <!-- grid de composição com losango -->
        <g transform="translate(75 110)" fill="none" stroke="#E5DAC8" stroke-width="1">
          <rect x="-40" y="-40" width="80" height="80" stroke-opacity=".35"/>
          <line x1="-13.3" y1="-40" x2="-13.3" y2="40" stroke-opacity=".22"/>
          <line x1="13.3" y1="-40" x2="13.3" y2="40" stroke-opacity=".22"/>
          <line x1="-40" y1="-13.3" x2="40" y2="-13.3" stroke-opacity=".22"/>
          <line x1="-40" y1="13.3" x2="40" y2="13.3" stroke-opacity=".22"/>
          <circle r="27" stroke="#26A69A" stroke-opacity=".8"/>
          <use href="#losango" transform="scale(2.1)" fill="#B71C1C" stroke="none"/>
        </g>
      </g>
    </g>

    <!-- brilhos mágicos -->
    <g fill="#E5DAC8">
      <use href="#brilhinho" transform="translate(1128 92) scale(.9)" opacity=".85"/>
      <use href="#brilhinho" transform="translate(1478 70) scale(.6)" opacity=".6"/>
      <use href="#brilhinho" transform="translate(1500 300) scale(.7)" opacity=".5"/>
      <use href="#brilhinho" transform="translate(1110 300) scale(.45)" opacity=".45"/>
      <use href="#brilhinho" transform="translate(1395 40) scale(.4)" opacity=".5"/>
    </g>
    <g fill="#26A69A">
      <circle cx="1160" cy="150" r="1.6" opacity=".8"/>
      <circle cx="1448" cy="128" r="1.3" opacity=".7"/>
      <circle cx="1470" cy="230" r="1.8" opacity=".6"/>
      <circle cx="1205" cy="58" r="1.2" opacity=".6"/>
      <circle cx="1530" cy="186" r="1.1" opacity=".5"/>
    </g>

    <!-- naipes discretos ocultos no grid (lado esquerdo, atrás da foto) -->
    <g fill="none" stroke="#E5DAC8" stroke-opacity=".07" stroke-width="1">
      <use href="#losango" transform="translate(132 66) scale(2.2)"/>
      <use href="#losango" transform="translate(330 132) scale(1.4)"/>
      <use href="#losango" transform="translate(264 330) scale(1.8)"/>
    </g>
  </svg>

  <div class="texto">
    <div class="kicker"><i></i>GABRIEL SOARES</div>
    <h1>Designer <span class="amp">&amp;</span><br>Web Designer</h1>
    <div class="linha"></div>
    <p class="sub"><b>Sites · Landing Pages · Social Media</b><br>
      <span class="ia">✦ IA aplicada para criar mais rápido, com mais qualidade</span></p>
  </div>

  
</div>
</body>
</html>
